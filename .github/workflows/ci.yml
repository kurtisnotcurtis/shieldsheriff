name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error ("Unformatted Go files:`n" + ($unformatted -join "`n"))
            exit 1
          }

      - name: Vet & Test
        shell: pwsh
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -v ./...
