name: Release ShieldSheriff (Portable Windows, Winget, Scoop & Chocolatey)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to v<VERSION.json version>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      choco_version: ${{ steps.meta.outputs.choco_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve Release Version & Tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag) -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $vj = Get-Content VERSION.json -Raw | ConvertFrom-Json
            $tag = "v$($vj.version)"
          }
          $version = $tag.TrimStart("v")
          $chocoVersion = [regex]::Replace($version, '(^|\.)0+(\d+)', '$1$2')
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "choco_version=$chocoVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_date=$releaseDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run Tests & Vet
        shell: pwsh
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -v ./...

      - name: Embed Windows VersionInfo & App Manifest (.syso)
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $winVer = "$ver.0"
          go install github.com/tc-hib/go-winres@v0.3.3
          $winresPath = Join-Path (go env GOPATH) "bin\go-winres.exe"
          Push-Location cmd/shieldsheriff
          & $winresPath make `
            --in winres/winres.json `
            --out rsrc `
            --arch amd64,arm64 `
            --product-version $winVer `
            --file-version $winVer
          Pop-Location

      - name: Build Portable Binaries & Archives
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $relDate = "${{ steps.meta.outputs.release_date }}"
          $ldflags = "-s -w -X shieldsheriff/internal/version.Version=$ver -X shieldsheriff/internal/version.ReleasedOn=$relDate"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
            $stage = "dist/stage-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            $env:CGO_ENABLED = "0"
            $env:GOOS = "windows"
            $env:GOARCH = $arch
            go build -mod=readonly -trimpath -ldflags="$ldflags" -o "$stage/shiesh.exe" ./cmd/shieldsheriff

            Copy-Item README.md, LICENSE -Destination $stage
            $zipPath = "dist/shieldsheriff-$ver-windows-$arch.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          }

          $shaAmd64 = (Get-FileHash "dist/shieldsheriff-$ver-windows-amd64.zip" -Algorithm SHA256).Hash
          $shaArm64 = (Get-FileHash "dist/shieldsheriff-$ver-windows-arm64.zip" -Algorithm SHA256).Hash

          @(
            "$shaAmd64  shieldsheriff-$ver-windows-amd64.zip"
            "$shaArm64  shieldsheriff-$ver-windows-arm64.zip"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8

          "sha256_amd64=$shaAmd64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256_arm64=$shaArm64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: build

      - name: Render Winget Manifests
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $date = "${{ steps.meta.outputs.release_date }}"
          $shaAmd64 = "${{ steps.build.outputs.sha256_amd64 }}"
          $shaArm64 = "${{ steps.build.outputs.sha256_arm64 }}"

          $outDir = "dist/winget/kurtisnotcurtis.ShieldSheriff/$ver"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Get-ChildItem "packaging/winget/kurtisnotcurtis.ShieldSheriff/*.yaml" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content.Replace("__VERSION__", $ver)
            $content = $content.Replace("__RELEASE_DATE__", $date)
            $content = $content.Replace("__SHA256_AMD64__", $shaAmd64)
            $content = $content.Replace("__SHA256_ARM64__", $shaArm64)
            Set-Content -Path (Join-Path $outDir $_.Name) -Value $content -Encoding utf8 -NoNewline
          }

          Compress-Archive -Path "dist/winget/*" -DestinationPath "dist/winget-manifests-$ver.zip" -Force

      - name: Render Scoop Manifest
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $shaAmd64 = "${{ steps.build.outputs.sha256_amd64 }}".ToLowerInvariant()
          $shaArm64 = "${{ steps.build.outputs.sha256_arm64 }}".ToLowerInvariant()

          New-Item -ItemType Directory -Force -Path "dist/scoop" | Out-Null
          $content = Get-Content "packaging/scoop/shieldsheriff.json" -Raw
          $content = $content.Replace("__VERSION__", $ver)
          $content = $content.Replace("__SHA256_AMD64__", $shaAmd64)
          $content = $content.Replace("__SHA256_ARM64__", $shaArm64)
          Set-Content -Path "dist/scoop/shieldsheriff.json" -Value $content -Encoding utf8 -NoNewline

      - name: Render & Pack Chocolatey Package
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $chocoVer = "${{ steps.meta.outputs.choco_version }}"
          $shaAmd64 = "${{ steps.build.outputs.sha256_amd64 }}".ToLowerInvariant()
          $shaArm64 = "${{ steps.build.outputs.sha256_arm64 }}".ToLowerInvariant()

          $chocoSrc = "dist/chocolatey-src"
          New-Item -ItemType Directory -Force -Path $chocoSrc, "dist/chocolatey" | Out-Null
          Copy-Item "packaging/chocolatey/shieldsheriff.nuspec" -Destination $chocoSrc
          Copy-Item "packaging/chocolatey/tools" -Destination $chocoSrc -Recurse

          foreach ($file in @("$chocoSrc/shieldsheriff.nuspec", "$chocoSrc/tools/chocolateyinstall.ps1")) {
            $content = Get-Content $file -Raw
            $content = $content.Replace("__CHOCO_VERSION__", $chocoVer)
            $content = $content.Replace("__VERSION__", $ver)
            $content = $content.Replace("__TAG__", $tag)
            $content = $content.Replace("__SHA256_AMD64__", $shaAmd64)
            $content = $content.Replace("__SHA256_ARM64__", $shaArm64)
            Set-Content -Path $file -Value $content -Encoding utf8 -NoNewline
          }

          choco pack "$chocoSrc/shieldsheriff.nuspec" --outputdirectory "dist/chocolatey"
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed with exit code $LASTEXITCODE" }

      - name: Upload Package Artifacts for Publish Jobs
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: |
            dist/scoop/shieldsheriff.json
            dist/chocolatey/shieldsheriff.${{ steps.meta.outputs.choco_version }}.nupkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "ShieldSheriff ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/shieldsheriff-${{ steps.meta.outputs.version }}-windows-amd64.zip
            dist/shieldsheriff-${{ steps.meta.outputs.version }}-windows-arm64.zip
            dist/SHA256SUMS.txt
            dist/winget-manifests-${{ steps.meta.outputs.version }}.zip
            dist/scoop/shieldsheriff.json
            dist/chocolatey/shieldsheriff.${{ steps.meta.outputs.choco_version }}.nupkg

  publish-winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check WinGet Token
        id: check
        shell: pwsh
        env:
          WINGET_ACC_TOKEN: ${{ secrets.WINGET_ACC_TOKEN }}
        run: |
          $enabled = (-not [string]::IsNullOrWhiteSpace($env:WINGET_ACC_TOKEN)).ToString().ToLowerInvariant()
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($enabled -eq "false") { Write-Host "WINGET_ACC_TOKEN secret not set; skipping automated WinGet PR." }

      - name: Submit PR to microsoft/winget-pkgs
        if: steps.check.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: kurtisnotcurtis.ShieldSheriff
          version: ${{ needs.release.outputs.version }}
          release-tag: ${{ needs.release.outputs.tag }}
          installers-regex: '^shieldsheriff-.*-windows-(amd64|arm64)\.zip$'
          token: ${{ secrets.WINGET_ACC_TOKEN }}

  publish-scoop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check Scoop Bucket Token
        id: check
        shell: bash
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -n "$SCOOP_BUCKET_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SCOOP_BUCKET_TOKEN secret not set; skipping automated Scoop bucket update."
          fi

      - name: Download Scoop Manifest
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: package-manifests
          path: rendered

      - name: Checkout Scoop Bucket
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCOOP_BUCKET_REPO || format('{0}/scoop-bucket', github.repository_owner) }}
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Commit & Push Updated Manifest
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p scoop-bucket/bucket
          cp rendered/scoop/shieldsheriff.json scoop-bucket/bucket/shieldsheriff.json
          cd scoop-bucket
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Scoop manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/shieldsheriff.json
          git commit -m "chore(shieldsheriff): update to v${{ needs.release.outputs.version }}"
          git push

  publish-chocolatey:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check Chocolatey API Key
        id: check
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $enabled = (-not [string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)).ToString().ToLowerInvariant()
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($enabled -eq "false") { Write-Host "CHOCO_API_KEY secret not set; skipping automated Chocolatey push." }

      - name: Download Chocolatey Package
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: package-manifests
          path: rendered

      - name: Push to Chocolatey Community Repository
        if: steps.check.outputs.enabled == 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = "rendered/chocolatey/shieldsheriff.${{ needs.release.outputs.choco_version }}.nupkg"
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "choco push failed with exit code $LASTEXITCODE" }
